name: quickchat
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quickchat
      POSTGRES_USER: quickchat
      POSTGRES_PASSWORD: quickchat-local-only
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U quickchat"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: quickchat
      MINIO_ROOT_PASSWORD: quickchat-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20 }
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 quickchat quickchat-local-secret && mc mb --ignore-existing local/quickchat-media"]
  clamav:
    image: clamav/clamav:1.4
    healthcheck: { test: ["CMD-SHELL", "clamdscan --ping=1"], interval: 10s, timeout: 5s, retries: 30 }
  migrate:
    build: .
    command: ["node", "server/dist/migrate.js"]
    environment: &server-env
      NODE_ENV: development
      DATABASE_URL: postgres://quickchat:quickchat-local-only@postgres:5432/quickchat
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ap-south-1
      S3_BUCKET: quickchat-media
      S3_ACCESS_KEY_ID: quickchat
      S3_SECRET_ACCESS_KEY: quickchat-local-secret
      ALLOWED_ORIGINS: http://localhost:5173
      CLAMAV_HOST: clamav
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: .
    environment: *server-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "server/dist/worker.js"]
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  minio-data:
