name: Release gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: Optional staging API URL for smoke tests
        required: false
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm security:deps
      - run: pnpm test:e2e:list
  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: quickchat:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quickchat:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
  staging-smoke:
    runs-on: ubuntu-latest
    needs: container
    if: ${{ inputs.staging_api_url != '' }}
    steps:
      - name: Verify staging readiness
        env: { STAGING_API_URL: "${{ inputs.staging_api_url }}" }
        run: curl --fail --retry 5 --retry-all-errors "$STAGING_API_URL/health/ready"
