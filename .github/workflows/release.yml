name: Release gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: Optional staging API URL for smoke tests
        required: false
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm security:deps
      - run: pnpm test:e2e:list
  staging-smoke:
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ inputs.staging_api_url != '' }}
    steps:
      - name: Verify staging readiness
        env: { STAGING_API_URL: "${{ inputs.staging_api_url }}" }
        run: curl --fail --retry 5 --retry-all-errors "$STAGING_API_URL/health/ready"
